# Startoptionen fuer den Dienst "lichtshow" (eine Zeile, ohne Anfuehrungszeichen).
# --device USB      Audiokarte per Namensteil suchen (stabiler als die Nummer)
# --strobe          Strobe-Bursts und Strobo-Preset erlauben (weglassen = kein Strobo)
# --web 8080       Web-Panel fuer iPad/Handy (http://<IP>:8080/)
# --energy-bias -0.1  insgesamt ruhiger (zwischen -0.3 und 0.3)
# Weitere Optionen: python3 show.py --help
SHOW_ARGS=--device USB --master 1.0 --strobe --web 8080
