<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Internetradio</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg"><meta name="theme-color" content="#171923">
<link rel="stylesheet" href="/static/sm/sm.css">
<style>
 body { padding: 12px 16px 40px; max-width: 900px; margin: 0 auto; font-size: 14px; line-height: 1.45; }
 .card { background: var(--pan); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
 .now { display: flex; gap: 14px; align-items: center; height: 96px; }   /* feste Hoehe: Knoepfe darunter springen nie (Wunsch 23.11.2026) */
 .now .t > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.45em; }
 .now .logo { width: 88px; height: 88px; }
 #hint { min-height: 52px; display: flow-root; }   /* Platz fuer zwei Hinweise (Verbinde, Eingang): die Seite darunter springt nicht (Wunsch 23.11.2026) */
 #hint > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
 #hint > div.err, #hint > div.warn { white-space: normal; }
 .logo { width: 72px; height: 72px; border-radius: 8px; background: #10121a; object-fit: contain; flex: 0 0 auto; }
 .lg { width: 40px; height: 40px; border-radius: 6px; background: #10121a; object-fit: contain; flex: 0 0 auto; }
 .ph { display: flex; align-items: center; justify-content: center; color: #889; font-weight: 600; font-size: 13px; }
 .now .t { flex: 1; min-width: 0; }
 .st { font-weight: 600; font-size: 16px; }
 .song { font-size: 15px; margin-top: 3px; }
 .dim { color: #889; font-size: 12px; }
 .warn { color: #ffb35a; font-size: 13px; margin-top: 6px; }
 .err { color: #ff6b5a; font-size: 13px; margin-top: 6px; }
 .ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
 .slots { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
 @media (max-width: 560px) { .slots { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
 .slot { border: 1px solid var(--line); border-radius: 8px; padding: 6px 4px; text-align: center; cursor: pointer; min-height: 62px;
         display: flex; flex-direction: column; align-items: center; gap: 3px; background: #1b1e29; position: relative; }
 .slot.on { outline: 2px solid #ff9a3c; }
 .slot.empty { border-style: dashed; color: #667; cursor: default; }
 .slot b { font-size: 11px; color: #99a; }
 .slot span { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
 .slot img { width: 26px; height: 26px; object-fit: contain; border-radius: 4px; }
 .slot .x { position: absolute; top: 2px; right: 4px; color: #ff6b5a; font-size: 13px; display: none; }
 body.edit .slot .x { display: block; }
 .filt { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
 .filt input[type=text] { flex: 1; min-width: 160px; }
 .row { display: flex; gap: 10px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--line); }
 .row:last-child { border-bottom: 0; }
 .row .n { flex: 1; min-width: 0; }
 .row .n div:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
 .ib { background: none; border: 1px solid var(--line); border-radius: 8px; min-width: 34px; height: 32px; color: inherit; cursor: pointer; }
 .ib.fav { color: #ff6b8a; }
 .pick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; }
 #list { max-height: 60vh; overflow-y: auto; padding: 4px 6px; }
 .row.cur { outline: 2px solid #ff9a3c; outline-offset: -1px; border-radius: 8px; background: #2b2418; border-bottom-color: transparent;
            box-shadow: 0 6px 16px rgba(255, 154, 60, .28); transform: translateY(-2px); position: relative; z-index: 1; }
 .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
 .seg button { border: 0; border-radius: 0; background: none; color: inherit; padding: 6px 10px; cursor: pointer; }
 .seg button.on { background: #3a2b18; color: #ffb86b; font-weight: 600; }
 .row.cur .n div:first-child { color: #ffb86b; font-weight: 600; }
 /* Fernseher-Ansicht (Wunsch 23.11.2026): nur Laufendes und die Programmplaetze, gross, mit der Fernbedienung bedienbar */
 body.tv #where, body.tv #herebox, body.tv #editbtn, body.tv #findcard { display: none !important; }
 body.tv { max-width: 1400px; font-size: 18px; }
 body.tv .slots { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
 body.tv .slot { min-height: 120px; padding: 10px 6px; gap: 8px; }
 body.tv .slot b { font-size: 16px; }
 body.tv .slot span { font-size: 16px; }
 body.tv .slot img, body.tv .slot .ph { width: 56px !important; height: 56px !important; }
 body.tv .ctl button { font-size: 18px; padding: 10px 18px; }
 .slot:focus-visible, .ctl button:focus-visible, #tvbtn:focus-visible { outline: 3px solid #ffb86b; outline-offset: 2px; }
 body.tv .slot:focus { outline: 3px solid #ffb86b; outline-offset: 2px; transform: scale(1.04); }
</style></head>
<body>
<div class="s2lnav" data-back="/musik" data-cur="radio" data-title="h_radio">Internetradio</div>

<div class="card">
 <div class="now">
  <img id="nlogo" class="logo cvimg" alt="">
  <div class="t">
   <div class="st" id="nst">Kein Sender gewählt</div>
   <div class="dim" id="nmeta"></div>
   <div class="song" id="nsong"></div>
   <div class="dim" id="ngenre"></div>
  </div>
  <img id="ncover" class="logo cvimg" data-zoom="320" alt="" style="visibility:hidden">
 </div>
 <div class="ctl">
  <button id="play">▶ Abspielen</button><button id="stop">■ Stopp</button>
  <span class="seg" id="where"><button data-w="mac">Ton: Musik-Rechner</button><button data-w="here">Ton: dieses Gerät</button></span>
  <span class="dim">Lautstärke</span><input type="range" id="vol" min="0" max="100" step="5" style="flex:1;min-width:120px"><span id="volv" class="dim"></span>
 </div>
 <div id="herebox" class="dim" style="margin-top:8px;display:none">
  <label><input type="checkbox" id="line"> Eingang am Light-Butler beim Abspielen auf Line-In stellen<span id="linedev"></span>, danach zurück
   (nur wenn dieses Gerät am Line-In hängt, zum Beispiel der Fernseher)</label>
 </div>
 <audio id="au" preload="none"></audio>
 <div id="hint"></div>
</div>

<div class="card">
 <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><b style="flex:1">Programmplätze</b>
  <button id="tvbtn" class="ib" style="padding:0 10px" title="Ansicht fuer den Fernseher: nur Programmplaetze, Ton auf diesem Geraet (merkt sich dieser Browser)">📺 Fernseher-Ansicht</button>
  <button id="editbtn" class="ib" style="padding:0 10px">Bearbeiten</button></div>
 <div class="slots" id="slots"></div>
</div>

<div class="card" id="findcard">
 <div class="filt">
  <select id="cc"><option value="">Land wird geladen …</option></select>
  <select id="tag"><option value="">alle Genres</option></select>
  <input type="text" id="q" placeholder="Sender suchen, z. B. Ö3, FM4, Jazz">
  <button id="go">Suchen</button>
  <label class="dim"><input type="checkbox" id="onlyfav"> nur Favoriten</label>
 </div>
 <div id="lst" class="dim" style="margin:6px 0"></div>
 <div id="pick"></div>
 <div id="list"></div>
 <div class="dim" style="margin-top:8px">Senderliste von radio-browser.info, einer freien Datenbank. Gespielt wird am Musik-Rechner (Light-Butler Helfer); der Ton geht von dort auch an den Light-Butler.</div>
</div>
<script src="/static/sm/nav.js"></script>
<script src="/static/sm/core.js"></script>
<script src="/static/sm/radio.js"></script>
</body></html>
