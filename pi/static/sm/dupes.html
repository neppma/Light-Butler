<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Doppelte</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg"><meta name="theme-color" content="#171923">
<link rel="stylesheet" href="/static/sm/sm.css">
<style>
 body.dup { padding: 12px 14px 40px; max-width: 1300px; margin: 0 auto; }
 #dhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
 #dstat { color: var(--dim); font-size: 13px; flex: 1 1 300px; }
 #dstat b { color: var(--txt); }
 #dmsg { color: #ffb35c; font-size: 13px; min-height: 18px; margin: 4px 0; }
 #dtabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; align-items: center; }
 #dtabs button.on, #bdel { background: var(--acc); border-color: var(--acc); color: #fff; }
 #dq { flex: 1 1 200px; min-height: 32px; }
 .grp { border: 1px solid var(--line); border-radius: 10px; background: var(--pan); margin-bottom: 10px; overflow: hidden; }
 .ghead { padding: 7px 10px; font-size: 13px; color: var(--dim); border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
 .ghead b { color: var(--txt); }
 .gbtns { margin-left: auto; display: flex; gap: 6px; } .gbtns button { min-height: 26px; padding: 2px 9px; font-size: 12px; }
 .gbtns .gdel:not(:disabled) { background: #6a2a2a; border-color: #8a3a3a; color: #fff; }
 .pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 6px 0 10px; font-size: 13px; color: var(--dim); }
 .pager b { color: var(--txt); }
 .fbtns { display: flex; flex-direction: column; gap: 4px; } .pb { min-width: 30px; min-height: 26px; padding: 0 6px; font-size: 12px; border-radius: 6px; }
 .frow { display: grid; grid-template-columns: 30px 64px 40px 48px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 10px; font-size: 13px; }
 .fcv { width: 48px; height: 48px; border-radius: 5px; overflow: hidden; background: #0003; } .fcv img { width: 100%; height: 100%; object-fit: cover; display: block; }
 .fcv.none { background: none; border: 1px dashed #ffffff30; }
 .frow + .frow { border-top: 1px solid #ffffff10; }
 .frow.keep { background: #1f5c3366; box-shadow: inset 4px 0 0 #3fbf6f; }   /* deutlich (Wunsch 07.11.2026: war zu zart) */
 .frow.del { background: #6b232366; box-shadow: inset 4px 0 0 #e0423a; }
 .frow.gone { opacity: .35; text-decoration: line-through; }
 .frow input[type=checkbox], .frow input[type=radio] { width: 18px; height: 18px; accent-color: var(--acc); }
 .fpath { overflow-wrap: anywhere; } .fpath small { color: var(--dim); }
 .facts { color: var(--dim); font-size: 12px; } .facts .good { color: #8fe0a5; } .facts .bad { color: #ff9a8a; }
 .why { font-size: 12px; color: #9fd0ff; max-width: 360px; }
 .ttake { color: #8fe0a5; margin-top: 3px; } .tdiff { color: #ffd38a; margin-top: 3px; }
 .tag { font-size: 11px; padding: 1px 6px; border-radius: 6px; margin-left: 4px; background: #2a2c3d; color: var(--dim); }
 .tag.same { background: #1e3a4d; color: #9fd0ff; }
 .klab { font-size: 11px; color: var(--dim); text-align: center; }
 .empty { color: var(--dim); padding: 20px 0; }
 @media (max-width: 700px) { .frow { grid-template-columns: 26px 54px 40px 40px minmax(0, 1fr); } .fcv { width: 40px; height: 40px; } .frow .why { grid-column: 5; } }
</style></head>
<body class="dup">
<div class="s2lnav" data-back="/musik" data-cur="musik" data-title="h_dupes">Doppelte</div>
<div id="dhead">
 <div id="dstat">Lade …</div>
 <button id="bnew" title="Die Bibliothek neu durchsehen (dauert rund eine Minute)">Neu prüfen</button>
 <button id="bdel" title="Alle angehakten Dateien dieser Seite in den Papierkorb des Musik-Rechners legen (wiederherstellbar)">Alle Markierten dieser Seite löschen</button>
</div>
<div id="dmsg"></div>
<div id="dtabs"><button data-f="sug" class="on">mit Vorschlag</button><button data-f="all">alle Gruppen</button><button data-f="mp4">MP4 neben MP3</button>
 <input type="search" id="dq" placeholder="Suchen: Interpret, Titel, Datei …"></div>
<div id="list"></div>
<div id="toast"></div>
<script src="/static/sm/core.js"></script>
<script src="/static/sm/tagedit.js"></script>
<script src="/static/sm/dupes.js"></script>
<script src="/static/sm/nav.js"></script>
</body></html>
