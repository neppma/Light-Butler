<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Interpreten</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg"><meta name="theme-color" content="#171923">
<link rel="stylesheet" href="/static/sm/sm.css">
<style>
 body.art { padding: 12px 16px 90px; }
 .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
 .bar input[type=search] { flex: 1 1 220px; min-height: 36px; font-size: 15px; }
 .bar select { min-height: 36px; }
 #letters { display: flex; flex-wrap: wrap; gap: 2px; margin: 4px 0 8px; }
 #letters button { min-width: 28px; min-height: 28px; padding: 0 6px; font-size: 12.5px; }
 #letters button.on, .tog.on { background: var(--acc); border-color: var(--acc); color: #fff; }
 #astat { color: var(--dim); font-size: 13px; margin: 4px 0; } #astat b { color: var(--txt); }
 .wrap { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
 #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
 .tile { background: none; border: 0; padding: 0; text-align: center; cursor: pointer; min-width: 0; color: var(--txt); }
 .tile .im { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center;
             font-size: 30px; font-weight: 700; border: 2px solid transparent; }
 .tile .im img { width: 100%; height: 100%; object-fit: cover; display: block; }
 .tile .im.noimg { border: 1px dashed var(--line); background: var(--pan); color: var(--dim); }
 .tile.cur .im { border-color: var(--acc); }
 .tile .nm { font-size: 13px; font-weight: 600; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
 .tile .ct { font-size: 11.5px; color: var(--dim); }
 .pager { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 8px 0; font-size: 13px; }
 .pager button { min-width: 32px; min-height: 30px; padding: 0 8px; font-size: 12.5px; } .pager button.on { background: var(--acc); border-color: var(--acc); color: #fff; }
 .pager button.num { width: 40px; padding: 0; font-variant-numeric: tabular-nums; } .pager button.nav { width: 84px; }
 .pager .gap { width: 40px; text-align: center; color: var(--dim); }
 #det { position: sticky; top: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--pan); padding: 12px; }
 #det .hd { display: flex; gap: 14px; align-items: flex-start; }
 #det .big { width: 150px; height: 150px; flex: none; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 52px; font-weight: 700; }
 #det .big img { width: 100%; height: 100%; object-fit: cover; }
 #det h2 { margin: 0 0 4px; font-size: 20px; overflow-wrap: anywhere; } #det .meta { color: var(--dim); font-size: 13px; }
 #det .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; } #det .acts button, #det .acts a { min-height: 30px; padding: 3px 10px; font-size: 12.5px; }
 #songs { margin-top: 12px; max-height: 60vh; overflow: auto; }
 .song { display: grid; grid-template-columns: 30px 30px 36px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
 .song img { width: 36px; height: 36px; border-radius: 4px; object-fit: cover; background: var(--line); cursor: pointer; }
 #ainfo { margin-top: 10px; font-size: 13px; } #ainfo .facts { color: var(--txt); margin-bottom: 6px; }
 #ainfo .bio { line-height: 1.5; color: #cfd3e3; white-space: normal; } #ainfo .bio.short { max-height: 6.2em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
 .lnk { background: none; border: 0; padding: 0; min-height: 0; color: var(--blue, #6fb3ff); font-size: 12.5px; cursor: pointer; text-decoration: none; }
 #ainfo .alh { margin: 10px 0 4px; color: var(--dim); font-size: 12px; }
 .albums { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; } .alb { flex: 0 0 92px; width: 92px; min-width: 0; font-size: 11px; }
 .alb img, .alb .noc { width: 92px; height: 92px; border-radius: 6px; object-fit: cover; background: var(--line); display: block; }
 .alb .at { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 3px; max-width: 100%; } .alb .ay { color: var(--dim); }
 #ainfo .src { color: var(--dim); font-size: 11px; margin-top: 6px; }
 .song .t { overflow-wrap: anywhere; } .song .s { color: var(--dim); font-size: 11.5px; } .song .p { color: var(--dim); font-variant-numeric: tabular-nums; }
 .pb { min-width: 28px; min-height: 26px; padding: 0 6px; font-size: 12px; border-radius: 6px; } .pb.on { background: var(--acc); border-color: var(--acc); color: #fff; }
 .modal .box.pick { width: min(720px, 94vw); max-width: none; max-height: 88vh; overflow: auto; }
 .sugs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 10px 0; }
 .sugs button { padding: 4px; background: var(--pan2); border: 2px solid var(--line); border-radius: 10px; color: var(--txt); font-size: 11.5px; }
 .sugs button:hover { border-color: var(--acc); } .sugs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; display: block; margin-bottom: 4px; }
 #bulk { font-size: 13px; color: var(--dim); }
 @media (max-width: 820px) { .wrap { grid-template-columns: minmax(0, 1fr); } #det { position: static; order: -1; } #songs { max-height: 45vh; } #det .big { width: 110px; height: 110px; } }
 .areaw { position: relative; } #areab { min-height: 36px; }
 #areap { position: absolute; z-index: 30; top: 40px; left: 0; width: min(420px, 92vw); max-height: 60vh; overflow: auto; background: var(--pan); border: 1px solid var(--line);
          border-radius: 10px; padding: 8px 10px; box-shadow: 0 10px 30px #000a; }
 #areap .ah { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; } #areap .ah button { min-height: 28px; font-size: 12.5px; padding: 2px 8px; }
 #areal .ag { color: var(--dim); font-size: 12px; margin: 8px 0 2px; } #areal label { display: flex; gap: 8px; align-items: center; padding: 3px 0; font-size: 13.5px; }
 #areal label .n { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }
 [hidden] { display: none !important; }
</style></head>
<body class="art">
<div class="s2lnav" data-back="/musik" data-cur="artists" data-title="h_artists">Interpreten</div>
<div class="bar">
 <input type="search" id="q" placeholder="Interpret suchen" autocomplete="off">
 <span class="areaw"><button id="areab" title="Nur Interpreten aus bestimmten Ordnern des Musikordners (etwa KLASSIK) oder mit einer Gruppe im Tag (etwa Après-Ski); mehrere anhakbar">Bereich: alle ▾</button>
  <div id="areap" hidden><div class="ah"><button id="aall">Alle anhaken</button><button id="anone">Keine (= alle zeigen)</button><button id="aclose">Fertig</button></div><div id="areal"></div></div></span>
 <button id="genb" title="Nur Interpreten mit Liedern in bestimmten Genres (etwa Pop); mehrere anhakbar, wirkt zusammen mit Bereich">Genre: alle ▾</button>
 <select id="sort" aria-label="Sortierung"><option value="n">meiste Lieder</option><option value="fav">Favoriten zuerst</option><option value="az">A bis Z</option><option value="plays">meist gespielt</option><option value="last">zuletzt gespielt</option></select>
 <button id="single" class="tog" title="Interpreten mit nur einem Lied zeigen">auch Einzellieder</button>
 <button id="noimg" class="tog" title="Nur Interpreten ohne Bild zeigen">nur ohne Bild</button>
 <button id="favonly" class="tog" title="Nur Interpreten mit Herz (Favoriten)">nur ♥</button>
</div>
<div id="letters"></div>
<div id="astat">Lade …</div>
<div class="bar"><button id="bbulk">Bilder für alle holen</button><button id="bretry" title="Interpreten, bei denen der Vorab-Lauf kein passendes Bild gefunden hat, gleich noch einmal suchen (sonst erst nach 30 Tagen). Von Hand entfernte Bilder bleiben leer.">Leere noch einmal versuchen</button><span id="bulk"></span></div>
<div class="wrap">
 <div><div class="pager" id="pgtop"></div><div id="grid"></div><div class="pager" id="pgbot"></div></div>
 <div id="det" hidden></div>
</div>
<input type="file" id="upfile" accept="image/*" hidden>
<div id="toast"></div>
<script src="/static/sm/core.js"></script>
<script src="/static/sm/tagedit.js"></script>
<script src="/static/sm/artists.js"></script>
<script src="/static/sm/nav.js"></script>
</body></html>
