<!doctype html><html lang="de"><head><meta charset="utf-8">

<title>Systemschema und Downloads</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg"><meta name="theme-color" content="#171923">
<link rel="stylesheet" href="/static/sm/sm.css">
<style>
 body { padding: 12px 16px 40px; max-width: 900px; margin: 0 auto; }
 #intro { margin: 2px 0 10px; font-size: 13px; }
 #schema { width: 100%; height: auto; display: block; }
 #schema text { fill: var(--txt); font: 600 14px Inter, sans-serif; }
 #schema text.s { fill: var(--dim); font-weight: 400; font-size: 12px; }
 #schema .bx { fill: var(--pan2); stroke: var(--line); }
 #schema .lb { fill: #26214a; stroke: #7f77dd; }
 #schema .sw { fill: #0f2e28; stroke: #1d9e75; }
 #schema .mu { fill: #33260c; stroke: #ba7517; }
 #schema .grp { fill: none; stroke: #4a4f70; stroke-dasharray: 4 4; }
 #schema .ar { stroke: #8a90a8; stroke-width: 1.3; fill: none; }
 #schema .fig { stroke: var(--dim); stroke-width: 1.6; fill: none; stroke-linecap: round; }
 #schema [data-k] { cursor: pointer; outline: none; }
 #schema [data-k]:hover rect, #schema [data-k]:focus rect { stroke: var(--acc); }
 #schema .ico .hit { fill: transparent; stroke: transparent; rx: 6px; }
 #schema .ico:hover .hit, #schema .ico:focus .hit, #schema .ico.sel .hit { fill: rgba(232,113,10,.18); stroke: var(--acc); }
 #schema .ico { fill: var(--txt); }
 #schema .ico.off use { opacity: .3; }
 #schema [data-k].sel > rect:first-child { stroke: var(--acc); stroke-width: 2; }
 #det { margin-top: 12px; background: var(--pan); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-height: 60px; }
 #det h2 { font-size: 15px; margin: 0 0 6px; }
 #det p { margin: 6px 0; font-size: 13px; color: var(--dim); }
 #det .dl { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
 #det .dl a.btn { justify-content: space-between; gap: 10px; min-height: 40px; font-size: 14px; }
 #det .soon { color: #ffb86b; }
 .leg { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--dim); margin-top: 6px; }
 .leg i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
</style></head>
