<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Showmanager</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg"><meta name="theme-color" content="#171923">
<link rel="stylesheet" href="/static/sm/sm.css">
</head><body class="play">
<div id="pl">
 <div class="s2lnav" data-back="/" data-cur="shows" data-title="h_showman">Showmanager</div>
 <div id="plhead"><button id="blk" title="BLACKOUT: alles dunkel, geht immer vor">BLACKOUT</button><a class="rbtn" href="/shows/handbuch.pdf" download="Showmanager-Handbuch.pdf" title="Bedienungsanleitung herunterladen (PDF)" aria-label="Bedienungsanleitung herunterladen"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10.3 5.2 7.6 4.5 4 4.5v13c3.6 0 6.3.7 8 2 1.7-1.3 4.4-2 8-2v-13c-3.6 0-6.3.7-8 2z"/><path d="M12 6.5v13"/></svg></a></div>
 <div class="card">
  <div class="plhead"><img id="plcover" class="cvimg" alt="" hidden><div id="plname">Keine Show gewählt</div></div>
  <div class="row"><span id="pltime">0:00.000</span><span class="spacer" style="flex:1"></span><span id="syncst"></span></div>
  <canvas id="wave"></canvas>
  <div id="plyric" style="min-height:1.4em;text-align:center;font-size:20px;font-weight:600;margin:6px 0"></div>
  <div id="ptrans">
   <button id="pstart" title="Zurück zum Anfang">⏮</button>
   <button id="pplay" title="Play / Pause">▶</button>
   <button id="ppause" title="Pause">⏸</button>
   <button id="pstop" title="Stop: zurück zur Musiksteuerung">⏹</button>
  </div>
  <div class="row" style="margin-top:10px">
   <span class="dim">Lautstärke</span><input id="vol" type="range" min="0" max="1" step="0.01" value="1" style="flex:1;display:block">
   <button id="psound" class="on" title="An: Dieser Browser spielt die Musik und gibt den Takt vor. Aus: nur Licht, die Musik kommt von woanders.">Ton hier</button>
   <button id="plight" class="on" title="Aus: nur anhören, das Licht bleibt bei AUTO.">Licht an</button>
  </div>
  <div id="pwarn" class="warn"></div>
 </div>
 <div class="card">
  <div class="row"><h3 style="margin:0;flex:1">Shows</h3><button id="pnew">+ Neue Show</button></div>
  <p id="stemact" class="dim" style="margin:6px 0 8px;font-size:12px" title="Spur-Kurven (Stimme, Bass, Kick, Snare/Hi-Hat, Sonstiges) rechnen der Mac oder der Windows-PC"></p>
  <div id="plist" style="margin-top:8px"></div>
 </div>
 <details class="card" id="trash">
  <summary style="cursor:pointer"><b id="trashsum">Papierkorb</b> <span class="dim">gelöschte Shows, zurücklegen oder endgültig löschen</span></summary>
  <div id="tlist" style="margin-top:8px"></div>
  <div class="row" style="margin-top:6px"><button id="tempty" class="danger">Papierkorb leeren</button></div>
 </details>
</div>
<audio id="audio" preload="auto"></audio>
<div id="toast"></div>
<script src="/static/sm/core.js"></script>
<script src="/static/sm/play.js"></script>
<script src="/static/sm/nav.js"></script>
</body></html>
